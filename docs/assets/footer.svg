<svg width="100%" height="80" viewBox="0 0 1000 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Flowing Gradient -->
    <linearGradient id="gradientFlowFooter" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#f5576c" />
      <stop offset="25%" stop-color="#f093fb" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="75%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#f5576c" />
      <animate attributeName="x1" values="0%;-200%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;0%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect width="1000" height="80" fill="#0d1117" rx="15" />

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="url(#gradientFlowFooter)">
    Built for SIH 2026
  </text>
</svg>
