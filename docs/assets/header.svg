<svg width="100%" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Flowing Gradient -->
    <linearGradient id="gradientFlow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="25%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#f093fb" />
      <stop offset="75%" stop-color="#f5576c" />
      <stop offset="100%" stop-color="#4facfe" />
      <animate attributeName="x1" values="0%;-200%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;0%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect width="1000" height="250" fill="#0d1117" rx="15" />

  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="90" fill="url(#gradientFlow)">
    🚂 BlockTrain
  </text>

  <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="28" fill="#c9d1d9">
    Next-Generation Railway Digital Twin &amp; Emergency Dispatch
  </text>
</svg>
